[build]
  command = "npm run build"
  publish = "dist"

# Redirecionamento SPA para React Router / navegação interna
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos de segurança recomendados
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
